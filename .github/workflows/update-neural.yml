name: Update Neural Grid
on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC
  workflow_dispatch:       # manual trigger
  push:
    branches: [main]
    paths:
      - "neural/node-grid/**"
      - "adapters/**"
      - "generators/**"
      - "generate.py"
      - "data/**"

permissions:
  contents: write

jobs:
  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate neural grid (real data)
        env:
          DATA_SOURCE: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python generate.py --real
      - name: Deploy to output branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # snapshot freshly generated files before any branch switch
          mkdir -p /tmp/output
          cp output/neural-grid-dark.svg output/neural-grid-light.svg \
             output/merged-prs-dark.svg output/merged-prs-light.svg \
             output/contributions.json /tmp/output/

          # remove untracked build artifacts so the branch switch can't collide
          git clean -fdx 2>/dev/null || true

          git fetch origin output || true
          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
          fi

          # replace with the fresh files (add only the intended assets, not .)
          git rm -rf . 2>/dev/null || true
          cp /tmp/output/* .
          git add neural-grid-dark.svg neural-grid-light.svg \
                  merged-prs-dark.svg merged-prs-light.svg contributions.json
          git commit -m "neural: $(date -u +%Y-%m-%d)" || echo "no change to commit"
          git push origin output
