name: Update Profile Assets
on:
  push:
    branches: [main]
    paths:
      - "data/merged-prs.json"
      - "generators/merged_prs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate merged-PR strip
        run: python -m generators.merged_prs || python generators/merged_prs.py
      - name: Commit output
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/merged-prs-dark.svg output/merged-prs-light.svg || true
          git diff --cached --quiet || git commit -m "prs: $(date -u +%Y-%m-%d)" && git push || echo "no push"
