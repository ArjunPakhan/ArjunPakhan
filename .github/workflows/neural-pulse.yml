name: Neural Pulse

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 4:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate neural contributions SVG
        run: node generate-svg.js --username ${{ github.repository_owner }}

      - name: Deploy to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if output branch exists, create if not
          git fetch origin output || true
          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
            touch .gitkeep
            git add .
            git commit -m "Initialize output branch"
          fi

          # Copy generated files
          cp dist/neural-contributions-dark.svg .
          cp dist/neural-contributions-light.svg .

          git add neural-contributions-dark.svg neural-contributions-light.svg
          git diff --cached --quiet || git commit -m "Update neural contributions SVG — $(date -u +%Y-%m-%d)"
          git push origin output
